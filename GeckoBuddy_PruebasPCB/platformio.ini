; Gecko Buddy - pruebas modulares de la placa principal y la PCB-C
; ESP32 DevKit V1 de 30 pines (DOIT, WROOM-32). Abrir esta carpeta en VS Code con PlatformIO.
;
; Cada [env:...] es un programa. Se elige en la barra azul de abajo (icono de carpeta "env:...")
; o en la barra lateral de PlatformIO (Project Tasks -> nombre del entorno -> Upload and Monitor).
;   menu_completo   : menu con las 9 pruebas
;   p1_esp32 ... p8_integracion : un programa por seccion, arranca directo en esa prueba

[platformio]
default_envs = menu_completo

[env]
platform = espressif32@6.9.0        ; Arduino-ESP32 2.0.17 (version fija para que compile igual siempre)
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_echo = yes                  ; ver lo que escribes en el monitor
monitor_eol = LF
monitor_filters = esp32_exception_decoder
upload_speed = 921600
build_flags = -Wall

[env:menu_completo]

[env:p1_esp32]
build_flags = ${env.build_flags} -DSOLO_PRUEBA=1

[env:p2_baterias]
build_flags = ${env.build_flags} -DSOLO_PRUEBA=2

[env:p3_stby_led]
build_flags = ${env.build_flags} -DSOLO_PRUEBA=3

[env:p4_motores]
build_flags = ${env.build_flags} -DSOLO_PRUEBA=4

[env:p5_ibus]
build_flags = ${env.build_flags} -DSOLO_PRUEBA=5

[env:p6_servos]
build_flags = ${env.build_flags} -DSOLO_PRUEBA=6

[env:p7_esc_edf]
build_flags = ${env.build_flags} -DSOLO_PRUEBA=7

[env:p8_integracion]
build_flags = ${env.build_flags} -DSOLO_PRUEBA=8
